[versions]
agp = "8.13.2"
# Chaquopy 17.0 → Python 3.10-3.14, AGP 7.3-9.2, minSdk 24 (verified against
# https://chaquo.com/chaquopy/doc/current/versions.html). FOX.TV pins Python 3.11
# because it is the last interpreter with armeabi-v7a/x86 binaries.
chaquopy = "17.0.0"
cryptoJs = "4.2.0"
kotlin = "2.3.0"
coreKtx = "1.15.0"
appcompat = "1.6.1"
composeBom = "2026.05.01"
tvMaterial = "1.1.0"
tvprovider = "1.0.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"

# Build and Android support dependencies
ksp = "2.3.12"
desugarJdkLibs = "2.1.4"
checkerQual = "3.43.0"
coreSplashscreen = "1.0.1"
recyclerview = "1.4.0"
guava = "33.3.1-android"
annotationExperimental = "1.3.1"

# Runtime dependencies
hilt = "2.58"
hiltNavigationCompose = "1.2.0"
# ALIGN_DECLARATION: debugRuntimeClasspath already resolved Retrofit 2.11.0.
retrofit = "2.11.0"
okhttp = { strictly = "5.3.2" }
moshi = "1.15.2"
# ALIGN_DECLARATION: debugRuntimeClasspath already resolved Coroutines 1.10.2.
coroutines = "1.10.2"
coil = "3.3.0"
lottie = "6.7.1"
navigationCompose = "2.8.9"
datastore = "1.2.1"
media3 = "1.8.0"
jsoup = "1.23.2"
gson = "2.10.1"
jackson = "2.17.0"
markdownRenderer = "0.33.0"
nanohttpd = "2.3.1"
cloudstream = "v4.7.0"
nicehttp = { strictly = "0.4.17" }
conscrypt = { strictly = "2.6.3" }
rhino = { strictly = "1.8.1" }
zxing = "3.5.3"
supabase = "3.2.1"
# ALIGN_DECLARATION: Supabase already selected Ktor core 3.2.1 at runtime.
ktor = "3.2.1"
# ALIGN_DECLARATION: debugRuntimeClasspath already resolved Serialization 1.9.0.
kotlinxSerialization = "1.9.0"
sentry = "8.56.0"
sentryGradle = "6.14.0"
assMedia = "0.4.0"
mpvAndroid = "0.1.12"
haze = "0.7.3"
metricsPerformance = "1.0.0-rc01"

# Test and performance tooling
benchmarkMacro = "1.4.1"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
uiautomator = "2.3.0"
profileinstaller = "1.4.1"
baselineProfilePlugin = "1.4.1"
junit4 = "4.13.2"
mockk = "1.13.12"

[libraries]
# Android and build support
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
checker-qual = { group = "org.checkerframework", name = "checker-qual", version.ref = "checkerQual" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version = "1.9.1" }
guava-android = { group = "com.google.guava", name = "guava", version.ref = "guava" }
androidx-annotation-experimental = { group = "androidx.annotation", name = "annotation-experimental", version.ref = "annotationExperimental" }

# Compose and TV
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime-tracing = { group = "androidx.compose.runtime", name = "runtime-tracing" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version.ref = "tvprovider" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Hilt
crypto-js = { module = "org.webjars.npm:crypto-js", version.ref = "cryptoJs" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Aniyomi host ABI — exact historical runtime pins required by Jellyfin 14.17
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version = "1.2.1" }
rxjava1 = { module = "io.reactivex:rxjava", version = "1.3.8" }

# Networking and serialization
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
okhttp-tls = { group = "com.squareup.okhttp3", name = "okhttp-tls", version.ref = "okhttp" }
moshi = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
moshi-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jackson" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Image loading and UI
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-network-cache-control = { group = "io.coil-kt.coil3", name = "coil-network-cache-control", version.ref = "coil" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
haze-android = { group = "dev.chrisbanes.haze", name = "haze-android", version.ref = "haze" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }

# Navigation and persistence
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Media3 — version 1.8.0 must remain aligned with the local forked core AARs
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-smoothstreaming = { group = "androidx.media3", name = "media3-exoplayer-smoothstreaming", version.ref = "media3" }
media3-exoplayer-rtsp = { group = "androidx.media3", name = "media3-exoplayer-rtsp", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-decoder = { group = "androidx.media3", name = "media3-decoder", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-container = { group = "androidx.media3", name = "media3-container", version.ref = "media3" }
media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }

# Plugin runtimes
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
cloudstream-library = { group = "com.github.recloudstream.cloudstream", name = "library", version.ref = "cloudstream" }
nicehttp = { group = "com.github.Blatzar", name = "NiceHttp", version.ref = "nicehttp" }
conscrypt-android = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
rhino = { group = "org.mozilla", name = "rhino", version.ref = "rhino" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
ass-media = { group = "io.github.peerless2012", name = "ass-media", version.ref = "assMedia" }
mpv-android = { group = "io.github.abdallahmehiz", name = "mpv-android-lib", version.ref = "mpvAndroid" }

# Supabase and diagnostics
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metricsPerformance" }

# Tests and performance tooling
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfilePlugin" }
