     deduplicated by the extractor's raw-string list. -->
<html>
<head><title>Watch</title></head>
<body>

  <span class="nv-server-tab tab_2" data-id="2">DUB</span>
</div>
<iframe src="player-frame.html"></iframe>
<button class="server-video" data-tab="tab_1" data-video="//__HOST__/embed/scheme-relative.html">SUB</button>

<button class="server-video" data-tab="tab_2" data-video="__BASE__hls/dub-direct.m3u8?token=dubfixture">DUB</button>
